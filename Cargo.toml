[package]
name = "rustjay-mosh"
version = "0.3.2"
edition = "2024"
description = "Rust-based NLE focused on datamoshing via I-frame removal and motion-vector manipulation"
license = "MIT"

# Numeric-heavy codec code is unusably slow without any optimisation in debug.
# opt-level 1 keeps incremental compile fast while speeding up the encoder ~10×.
[profile.dev]
opt-level = 1

[dependencies]
thiserror = "2"
ffmpeg-next = "8"
eframe = { version = "0.29", features = ["wgpu"] }
wgpu = "22"
rfd = "0.15"
rayon = "1"
tempfile = "3"
hound = "3"
image = "0.25"
rand = { version = "0.8", features = ["small_rng"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
dirs = "5"

